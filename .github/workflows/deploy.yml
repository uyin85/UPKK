name: Deploy UPKK Pro

# Semua persediaan berlaku di sini supaya tiada arahan perlu dijalankan di komputer.
# Secret GitHub yang diperlukan (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY, ADMIN_TOKEN, MCP_TOKEN
# Pilihan: HERMES_URL, HERMES_API_KEY, MODAL_TOKEN_ID, MODAL_TOKEN_SECRET

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      - name: Semak secret Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Tambah CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID di Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Cipta indeks Vectorize (sekali sahaja)
        run: |
          for idx in upkk-questions upkk-sources; do
            if npx wrangler vectorize get "$idx" >/dev/null 2>&1; then
              echo "$idx sudah wujud"
            else
              npx wrangler vectorize create "$idx" --dimensions=1024 --metric=cosine
            fi
          done

      - name: Kemas kini skema & silibus D1
        run: |
          npx wrangler d1 execute upkk --remote --file=schema.sql
          node scripts/build-seed.mjs > seed.sql
          npx wrangler d1 execute upkk --remote --file=seed.sql

      - name: Sediakan secret Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          HERMES_URL: ${{ secrets.HERMES_URL }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          node -e '
            const keys = ["GEMINI_API_KEY","ADMIN_TOKEN","MCP_TOKEN","HERMES_URL","HERMES_API_KEY"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(".secrets.json", JSON.stringify(out));
            console.log("Secret disediakan:", Object.keys(out).join(", ") || "(tiada)");
          '

      - name: Deploy Worker
        run: npx wrangler deploy --secrets-file .secrets.json

      - name: Padam fail secret
        if: always()
        run: rm -f .secrets.json

  hermes:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Langkau jika Modal belum disediakan
        id: chk
        run: |
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] && [ -n "$HERMES_API_KEY" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "Modal tidak disediakan — langkau Hermes"; fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == '1'
        with:
          python-version: '3.12'
      - name: Deploy Hermes ke Modal
        if: steps.chk.outputs.run == '1'
        run: |
          pip install modal
          modal secret create upkk-hermes HERMES_API_KEY="$HERMES_API_KEY" --force
          modal deploy modal/hermes_server.py

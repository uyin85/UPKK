<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Ustaz</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .app { max-width: 880px; padding-bottom: 48px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card textarea, .card input, .card select { width: 100%; }
    textarea.in { min-height: 70px; padding: 10px 14px; resize: vertical; line-height: 1.6; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .qa { font-size: 14px; background: var(--paper); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
    .qa ul { margin: 4px 0; padding-left: 18px; }
    .score-chip { font-weight: 600; padding: 2px 10px; border-radius: 99px; background: var(--good-bg); color: var(--good); }
    .score-chip.low { background: var(--bad-bg); color: var(--bad); }
    .warn { color: var(--bad); font-weight: 500; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="hide-tabs">
  <main class="app" id="app"></main>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>

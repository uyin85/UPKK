name = "upkk-pro"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/admin/api/*", "/mcp"]

[[d1_databases]]
binding = "DB"
database_name = "upkk"
database_id = "ef36be22-045a-4866-a4f7-5b49a6cc8549"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "upkk-sources"

# Indeks bank soalan + penanda kertas lepas (keaslian/duplikasi)
[[vectorize]]
binding = "QVEC"
index_name = "upkk-questions"

# Indeks petikan sumber (grounding penjana & penyemak syariah)
[[vectorize]]
binding = "SVEC"
index_name = "upkk-sources"

[ai]
binding = "AI"

[[workflows]]
name = "upkk-generate"
binding = "GENERATOR"
class_name = "GenerateWorkflow"
# 2:15 pagi waktu Malaysia setiap hari: sentinel kualiti + jana soalan untuk topik paling memerlukan
schedules = ["15 18 * * *"]

[vars]
# Rantai model ikut urutan; bila satu kena had/kuota habis, terus ke model seterusnya.
# Model tiada / tiada akses dilangkau 6 jam; kuota harian habis dilangkau 1 jam.
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-3.1-pro-preview-customtools,gemini-2.5-pro"
# Lapisan terakhir (tidak guna kuota Google). Letak WORKERS_AI_FALLBACK = "false" untuk matikan.
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
HERMES_MODEL = "hermes"
FREE_DAILY_LIMIT = "15"
DAILY_GEN_COUNT = "8"
SHOW_PENDING = "false"
MCP_CAN_APPROVE = "false"

# Rahsia (npx wrangler secret put NAMA):
#   GEMINI_API_KEY, HERMES_URL, HERMES_API_KEY, ADMIN_TOKEN, MCP_TOKEN
